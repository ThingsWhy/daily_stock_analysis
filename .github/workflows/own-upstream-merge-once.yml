name: One-time Upstream Merge Into Own

on:
  push:
    branches: [own]
    paths:
      - .github/workflows/own-upstream-merge-once.yml

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out own and full history
        uses: actions/checkout@v4
        with:
          ref: own
          fetch-depth: 0
          persist-credentials: true

      - name: Merge upstream main and resolve context conflicts from the common ancestor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge-base --is-ancestor ec66bf46caf6993f673bd4be59c883754667b686 origin/main
          git merge-base --is-ancestor ec66bf46caf6993f673bd4be59c883754667b686 HEAD
          if git merge --no-commit --no-ff origin/main; then
            echo 'Automatic Git merge succeeded.'
          else
            echo 'Resolve contextual conflicts using original-line changes.'
          fi
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(['git', *args])

          def decode(value):
              return value.decode('utf-8', errors='surrogateescape')

          def changes(patch):
              edits = []
              pending = None
              position = 0
              for line in patch.split('\n'):
                  hunk = re.match(r'^@@ -(\d+)(?:,(\d+))? \+\d+(?:,\d+)? @@', line)
                  if hunk:
                      if pending is not None:
                          edits.append(pending)
                      first = int(hunk.group(1))
                      count = int(hunk.group(2) or 1)
                      position = first - 1 if count else first
                      pending = None
                  elif line.startswith(('--- ', '+++ ')):
                      continue
                  elif line.startswith((' ', '+', '-')):
                      operation, value = line[:1], line[1:]
                      if operation == ' ':
                          if pending is not None:
                              edits.append(pending)
                              pending = None
                          position += 1
                      else:
                          if pending is None:
                              pending = {'start': position, 'end': position, 'removed': [], 'added': []}
                          if operation == '-':
                              pending['removed'].append(value)
                              pending['end'] += 1
                              position += 1
                          else:
                              pending['added'].append(value)
              if pending is not None:
                  edits.append(pending)
              return edits

          def apply(original, edits):
              base_lines = original.split('\n')
              result = []
              cursor = 0
              for item in sorted(edits, key=lambda item: (item['start'], item['end'])):
                  start, end = item['start'], item['end']
                  if start < cursor or base_lines[start:end] != item['removed']:
                      raise RuntimeError(f'Conflicting original-line edits at {start}:{end}')
                  result.extend(base_lines[cursor:start])
                  result.extend(item['added'])
                  cursor = end
              result.extend(base_lines[cursor:])
              return '\n'.join(result)

          base = decode(git('merge-base', 'HEAD', 'origin/main')).strip()
          pending = git('diff', '--name-only', '--diff-filter=U', '-z')
          conflicts = [item.decode('utf-8') for item in pending.split(b'\0') if item]
          print('Conflicting files:', conflicts)
          for path in conflicts:
              original = decode(git('show', f'{base}:{path}'))
              ours = decode(git('show', f'HEAD:{path}'))
              theirs = decode(git('show', f'origin/main:{path}'))
              ours_patch = decode(git('diff', '--no-ext-diff', '--unified=0', base, 'HEAD', '--', path))
              theirs_patch = decode(git('diff', '--no-ext-diff', '--unified=0', base, 'origin/main', '--', path))
              a, b = changes(ours_patch), changes(theirs_patch)
              if apply(original, a) != ours or apply(original, b) != theirs:
                  raise RuntimeError(f'Patch reconstruction did not match either side: {path}')
              result = apply(original, a + b)
              Path(path).write_bytes(result.encode('utf-8', errors='surrogateescape'))
              subprocess.run(['git', 'add', '--', path], check=True)
              print(f'Preserved both sets of edits: {path}')
          if git('diff', '--name-only', '--diff-filter=U').strip():
              raise RuntimeError('Some Git conflicts remain unresolved')
          PY
          python3 -m compileall -q src api
          git diff --cached --check
          git status --short
          git commit -m 'merge(own): integrate upstream main and preserve custom strategy features'
          git push origin HEAD:own
